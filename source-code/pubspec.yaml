name: hackerdeck
description: Waydroid management tool with keymapper, APK store and multi-instance support
version: 0.4.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  process_run: ^1.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  window_manager: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
